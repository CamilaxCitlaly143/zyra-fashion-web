<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYRA FASHION - Moda Europea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="encabezado-navegacion">
        <div class="logo">
            <h2>ZYRA</h2>
            <p>Moda sin fronteras</p>
        </div>
        <nav class="menu-navegacion">
            <a href="index.html" class="btn-nav">Inicio</a>
            <a href="catalogo de productos.html" class="btn-nav">Menú</a>
            <a href="nosotros.html" class="btn-nav">¿Quiénes somos?</a>
        </nav>
    </header>

    <main class="contenedor-seccion-continente">
        
        <div class="banner-continente">
            <h1>ZYRA &nbsp;&nbsp; MODA EUROPEA</h1>
        </div>

        <div class="pizarra-diseno-oscura">
            
            <section class="columna-catalogo-canva">
                <div class="pestana-categorias-boceto">
                    <span>ROPA &nbsp;&nbsp;&nbsp;&nbsp; CALZADO &nbsp;&nbsp;&nbsp;&nbsp; ACCESORIOS</span>
                </div>
                <div class="espacio-imagen-catalogo">
                    <img src="accesorios europeos.jpg" alt="Ropa Calzado y Accesorios Europeos" class="imagen-catalogo-completa">
                </div>
            </section>

            <section class="columna-modelo-boceto">
                <div class="contenedor-analisis-outfit">
                    
                    <div class="foto-modelo-analisis">
                        <img src="modelo-europea.jpg" alt="Modelo Europea" class="imagen-modelo-real">
                    </div>

                    <div class="etiquetas-outfit">
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>ABRIGO CLÁSICO:</strong> TONO PASTELES / CORTE ELEGANTE</p>
                        </div>
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>PRENDA INTERIOR:</strong> BLUSA LIGERA DE CUELLO ALTO</p>
                        </div>
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>PANTALÓN:</strong> CORTE RECTO ESTILIZADO</p>
                        </div>
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>ACCESORIOS:</strong> BOLSO DE MANO MINIMALISTA</p>
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </main>

</body>
</html>
