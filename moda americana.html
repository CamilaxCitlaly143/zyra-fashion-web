<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYRA FASHION - Moda Americana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="encabezado-navegacion">
        <div class="logo">
            <h2>ZYRA</h2>
            <p>Moda sin fronteras</p>
        </div>
        <nav class="menu-navegacion">
            <a href="index.html" class="btn-nav">Inicio</a>
            <a href="catalogo de poductos.html" class="btn-nav">Menú</a>
            <a href="nosotros.html" class="btn-nav">¿Quiénes somos?</a>
        </nav>
    </header>

    <main class="contenedor-seccion-continente">
        
        <div class="banner-continente">
            <h1>ZYRA &nbsp;&nbsp; MODA AMERICANA</h1>
        </div>

        <div class="pizarra-diseno-oscura">
            
            <section class="columna-catalogo-canva">
                <div class="pestana-categorias-boceto">
                    <span>ROPA &nbsp;&nbsp;&nbsp;&nbsp; CALZADO &nbsp;&nbsp;&nbsp;&nbsp; ACCESORIOS</span>
                </div>
                <div class="espacio-imagen-catalogo">
                    <img src="accesorios americana.jpg" alt="Ropa Calzado y Accesorios Americanos" class="imagen-catalogo-completa">
                </div>
            </section>

            <section class="columna-modelo-boceto">
                <div class="contenedor-analisis-outfit">
                    
                    <div class="foto-modelo-analisis">
                        <img src="modelo-americana.jpg.jpg" alt="Modelo Americana" class="imagen-modelo-real">
                    </div>

                    <div class="etiquetas-outfit">
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>SUÉTER TEJIDO:</strong> ROJO VINO</p>
                        </div>
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>DISEÑO:</strong> HOMBROS DESCUBIERTOS</p>
                        </div>
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>PANTALÓN DE MEZCLILLA:</strong> CORTE WIDE LEG</p>
                        </div>
                        <div class="etiqueta-item">
                            <span class="flecha">→</span>
                            <p><strong>TACONES NEGROS:</strong> PUNTA CERRADA</p>
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </main>

</body>
</html>
